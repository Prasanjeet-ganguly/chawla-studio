# Chawla Studio — Apache configuration for the static export.
#
# `npm run export` copies this file to out/.htaccess. Upload the *contents* of
# out/ into htdocs/ on the host and this lands beside index.html, where Apache
# picks it up automatically.
#
# It exists because `output: 'export'` writes files and nothing else: the
# Cache-Control policy that next.config.ts serves in a Node deployment has to be
# stated here instead. Everything below is Apache 2.4 with mod_headers and
# mod_deflate, both enabled on InfinityFree and on ordinary cPanel hosting. Each
# block is wrapped in <IfModule> so a host missing one still serves the site
# rather than a 500, and the rules match on file extension rather than on
# request-path expressions, which not every shared host allows in .htaccess.

# ---------------------------------------------------------------------------
# Clean URLs
# ---------------------------------------------------------------------------
# The export is built with trailingSlash, so /blog is a real directory holding
# index.html and Apache resolves it without any rewrite rules. DirectorySlash
# keeps the canonical form: a request for /blog is redirected to /blog/ rather
# than the same page answering at two addresses.
DirectoryIndex index.html
DirectorySlash On

# Next's own 404 page, so a mistyped URL keeps the site's design instead of
# falling through to Apache's default page or the host's parking page.
ErrorDocument 404 /404.html

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>
  # Photograph variant filenames are stable across rebuilds (id + width, with no
  # content hash), so these must not be immutable: replacing a frame in /Photos
  # has to reach visitors who already hold the old one. A week of hard caching
  # with a month of background revalidation keeps repeat visits instant without
  # pinning a stale photograph for a year. This is the same policy next.config.ts
  # sends for /photos when the site runs on Node.
  <FilesMatch "\.(avif|webp|jpe?g|png|gif|svg|ico)$">
    Header set Cache-Control "public, max-age=604800, stale-while-revalidate=2592000"
  </FilesMatch>

  # Every stylesheet, script and font in the export is content-hashed under
  # /_next/static, so a change means a new filename and these can be pinned.
  <FilesMatch "\.(css|js|mjs|woff2?)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>

  # HTML, the sitemap and robots.txt must always be revalidated, or a deploy
  # never reaches anyone holding a cached page that names the old bundles.
  <FilesMatch "\.(html|xml|txt|json)$">
    Header set Cache-Control "public, max-age=0, must-revalidate"
  </FilesMatch>

  # This site frames nothing cross-origin and has no reason to hand full URLs to
  # third parties, so the defaults are tightened for every response.
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "SAMEORIGIN"
</IfModule>

# ---------------------------------------------------------------------------
# Compression
# ---------------------------------------------------------------------------
# AVIF, WebP and the JPEG fallback are already compressed — running deflate over
# them costs CPU and saves nothing, so only text is listed.
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml
  AddOutputFilterByType DEFLATE application/javascript application/json
  AddOutputFilterByType DEFLATE image/svg+xml application/xml
</IfModule>

# ---------------------------------------------------------------------------
# MIME types
# ---------------------------------------------------------------------------
# Older Apache builds on shared hosts do not know AVIF, and an image served as
# application/octet-stream is an image the browser refuses to draw. The loading
# screen's frame is AVIF first, so this decides the very first paint.
<IfModule mod_mime.c>
  AddType image/avif .avif
  AddType image/webp .webp
  AddType font/woff2 .woff2
  AddType application/manifest+json .webmanifest
</IfModule>

# Next exports the Open Graph card as a file with no extension at all
# (out/opengraph-image), so nothing above can type it. Left alone Apache sends
# application/octet-stream and the social crawlers refuse to draw the card.
<Files "opengraph-image">
  ForceType image/png
  <IfModule mod_headers.c>
    Header set Cache-Control "public, max-age=604800, stale-while-revalidate=2592000"
  </IfModule>
</Files>
